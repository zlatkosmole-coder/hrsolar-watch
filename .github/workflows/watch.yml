name: watch
on:
  schedule:
    - cron: "*/15 4-12 * * *"    # every 15 min, 04-12 UTC (06-14 h local in summer, 05-13 h in winter)
    - cron: "*/30 13-18 * * *"   # every 30 min until the evening
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python watch.py
        env:
          ENTSOE_TP_USER: ${{ secrets.ENTSOE_TP_USER }}
          ENTSOE_TP_PASSWORD: ${{ secrets.ENTSOE_TP_PASSWORD }}
      - name: commit the logs
        run: |
          git config user.name "hrsolar-watch"
          git config user.email "actions@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -m "watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push --quiet
